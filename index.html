<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>阪南大学トランポリンクラブ</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="阪南トランポリン" />
<meta name="theme-color" content="#0A1712" />
<style>
  html, body { margin: 0; padding: 0; background: #0A1712; min-height: 100%; }
  * { box-sizing: border-box; }
  input, textarea, select, button { font-family: inherit; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }

  .app-shell { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #EAF3EC; }
  .container { max-width: 480px; margin: 0 auto; padding: 28px 18px 96px; }

  .draft-banner { border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; background: #24230E; border: 1px solid #6B5A1E; color: #FFD870; font-size: 11px; line-height: 1.6; }

  .header-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .app-logo { width: 38px; height: 38px; border-radius: 8px; display: block; flex-shrink: 0; object-fit: contain; background: #fff; padding: 3px; }
  .app-title-wrap { min-width: 0; }
  .app-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-tag { font-size: 10px; color: #6E8779; }

  .tabs { display: flex; border-radius: 12px; padding: 4px; margin: 20px 0 16px; background: #10201A; border: 1px solid #234534; }
  .tab-btn { flex: 1; padding: 9px 0; border-radius: 8px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; background: transparent; color: #8FAA9B; }
  .tab-btn.active { background: #22C17E; color: #052A1B; }

  .section { display: flex; flex-direction: column; gap: 16px; }
  .field-label { font-size: 12px; margin-bottom: 6px; display: block; color: #6E8779; }
  .sub-label { font-size: 10px; color: #6E8779; margin: 2px 0 0; line-height: 1.5; }

  .chip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chip-grid.two { grid-template-columns: repeat(2, 1fr); }
  .chip-grid.four { grid-template-columns: repeat(4, 1fr); }
  .chip-btn { padding: 10px 4px; border-radius: 8px; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.25; cursor: pointer; background: #17301F; color: #EAF3EC; border: 1px solid #234534; }
  .chip-btn.active { background: #22C17E; color: #052A1B; border-color: #22C17E; }
  .chip-btn.amber.active { background: #FF9645; color: #2A1608; border-color: #FF9645; }

  /* よく使う技(最近記録した技のクイック選択) */
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-btn.recent-skill-chip { padding: 7px 11px; font-size: 11px; text-align: left; flex: 0 0 auto; max-width: 100%; }

  /* 本数のステッパー */
  .reps-step { display: flex; align-items: center; gap: 14px; }
  .reps-step-btn { width: 42px; height: 42px; border-radius: 8px; border: 1px solid #234534; background: #17301F; color: #EAF3EC; font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer; font-family: inherit; }
  .reps-step-btn:disabled { color: #4A5F52; cursor: default; }
  .reps-step-num { font-size: 22px; font-weight: 700; min-width: 32px; text-align: center; color: #EAF3EC; }
  .reps-step-num.zero { color: #6E8779; }
  .reps-step-unit { font-size: 12px; color: #6E8779; }

  /* 本数ぶんの成功/失敗 */
  .rep-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .rep-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid #234534; border-radius: 8px; padding: 7px 9px; background: #10201A; }
  .rep-idx { font-size: 12px; color: #6E8779; white-space: nowrap; }
  .rep-picks { display: flex; gap: 5px; }
  .rep-pick { font-size: 12px; font-weight: 700; font-family: inherit; padding: 6px 11px; border-radius: 8px; border: 1px solid #234534; background: #17301F; color: #6E8779; cursor: pointer; }
  .rep-pick.ok.on { background: #22C17E; border-color: #22C17E; color: #052A1B; }
  .rep-pick.ng.on { background: #FF9645; border-color: #FF9645; color: #2A1608; }
  .rep-pick.soon { border-style: dashed; opacity: 0.45; cursor: default; }
  .chip-sub { display: block; font-size: 9px; font-weight: 400; opacity: .75; margin-top: 2px; }

  .select-wrap { position: relative; }
  .select-input { width: 100%; appearance: none; -webkit-appearance: none; border-radius: 8px; padding: 10px 32px 10px 12px; font-size: 14px; background: #17301F; border: 1px solid #234534; color: #EAF3EC; outline: none; }
  .select-chevron { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }

  .date-input, .text-input { width: 100%; border-radius: 8px; padding: 10px 12px; font-size: 14px; background: #17301F; border: 1px solid #234534; color: #EAF3EC; outline: none; color-scheme: dark; }
  .date-warning { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(255, 150, 69, 0.14); border: 1px solid rgba(255, 150, 69, 0.5); color: #FFB578; font-size: 12px; line-height: 1.5; }

  .card { border-radius: 12px; padding: 14px; background: #10201A; border: 1px solid #234534; }
  .card.raised { background: #17301F; }

  .skill-info-card { border-radius: 10px; padding: 12px; background: #17301F; border: 1px solid #234534; }
  .skill-info-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .skill-info-code { font-size: 10px; font-family: ui-monospace, monospace; color: #22C17E; background: #0A1712; border: 1px solid #24603F; border-radius: 6px; padding: 3px 6px; display: inline-block; margin-top: 4px; }
  .dd-breakdown { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .dd-piece { flex: 1; min-width: 64px; border-radius: 8px; padding: 8px; background: #0A1712; border: 1px solid #234534; text-align: center; }
  .dd-piece-label { font-size: 9px; color: #6E8779; }
  .dd-piece-value { font-size: 15px; font-weight: 700; font-family: ui-monospace, monospace; margin-top: 2px; }
  .dd-piece.total { background: #133220; border-color: #22C17E; }
  .dd-piece.total .dd-piece-value { color: #3EDB98; }

  .tech-row-list { display: flex; flex-direction: column; gap: 10px; }
  .tech-row { border-radius: 10px; padding: 12px; background: #17301F; border: 1px solid #234534; display: flex; flex-direction: column; gap: 8px; }
  .tech-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tech-row-idx { font-size: 11px; color: #6E8779; font-family: ui-monospace, monospace; }
  .remove-btn { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #10201A; color: #6E8779; border: none; cursor: pointer; flex-shrink: 0; padding: 0; }
  .code-badge { font-size: 10px; font-family: ui-monospace, monospace; color: #22C17E; background: #0A1712; border: 1px solid #24603F; border-radius: 6px; padding: 3px 6px; display: inline-block; }
  .inline-row { display: flex; align-items: center; gap: 8px; }

  .add-row-btn { margin-top: 2px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #10201A; border: 1px dashed #234534; color: #22C17E; cursor: pointer; }
  .add-row-btn[disabled] { opacity: .4; cursor: not-allowed; }

  .video-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .video-slot-label { font-size: 10px; color: #6E8779; margin-bottom: 4px; display: block; }
  .video-add-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; border-radius: 8px; background: #10201A; border: 1px dashed #234534; color: #9FBBAA; cursor: pointer; font-size: 11px; text-align: center; }
  .video-add-btn.fail-tone { border-color: #6B4A1E; }
  .video-slot-filled { position: relative; border-radius: 8px; overflow: hidden; height: 64px; background: #000; border: 1px solid #234534; cursor: pointer; }
  .video-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-slot-name { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 24px 3px 6px; font-size: 9px; color: #EAF3EC; background: linear-gradient(0deg, rgba(0,0,0,.75), rgba(0,0,0,0)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .video-remove-btn { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(10,23,18,.85); color: #EAF3EC; border: none; cursor: pointer; padding: 0; }
  .video-play-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: rgba(10,23,18,.55); display: flex; align-items: center; justify-content: center; }
  .recent-video-btn { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 3px 7px 3px 5px; border-radius: 6px; border: 1px solid #234534; background: #17301F; color: #22C17E; cursor: pointer; }
  .recent-video-btn.fail-tone { color: #FF9645; }

  .video-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(4,10,8,.9); z-index: 100; align-items: center; justify-content: center; padding: 24px; color: #EAF3EC; }
  .video-modal-overlay.open { display: flex; }
  .video-modal-box { width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
  .video-modal-box video { width: 100%; max-height: 70vh; border-radius: 10px; background: #000; display: block; }
  .video-modal-caption { font-size: 12px; color: #9FBBAA; margin-top: 10px; text-align: center; }
  .video-modal-close { margin: 14px auto 0; display: block; padding: 8px 18px; border-radius: 8px; background: #17301F; border: 1px solid #234534; color: #EAF3EC; font-size: 12px; cursor: pointer; }

  .note-textarea { width: 100%; border-radius: 8px; padding: 10px 12px; font-size: 14px; background: #17301F; border: 1px solid #234534; color: #EAF3EC; outline: none; resize: none; }

  .num-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .num-field-label { font-size: 10px; color: #6E8779; }
  .num-input { border-radius: 8px; padding: 9px 8px; font-size: 12px; font-family: ui-monospace, monospace; background: #17301F; border: 1px solid #234534; color: #EAF3EC; outline: none; width: 100%; }

  .save-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 0; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; background: #22C17E; color: #052A1B; }
  .save-btn.flash { background: #3EDB98; }
  .save-btn[disabled] { opacity: .4; cursor: not-allowed; }

  .empty-card { border-radius: 12px; padding: 24px; text-align: center; font-size: 13px; background: #10201A; border: 1px solid #234534; color: #6E8779; line-height: 1.7; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card { border-radius: 12px; padding: 14px; background: #10201A; border: 1px solid #234534; }
  .stat-card.clickable { cursor: pointer; }
  .stat-card.clickable:active { background: #17301F; }
  .stat-label { font-size: 10px; color: #6E8779; margin-bottom: 4px; }
  .stat-value { font-size: 18px; font-weight: 700; font-family: ui-monospace, monospace; }
  .stat-sub { font-size: 10px; color: #6E8779; margin-top: 2px; }
  .stat-sub.link { color: #22C17E; }

  .chart-card { border-radius: 12px; padding: 16px; background: #10201A; border: 1px solid #234534; }
  .chart-title { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 12px; color: #6E8779; }
  .chart-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 6px 10px; border-radius: 6px; background: #17301F; border: 1px solid #234534; color: #9FBBAA; cursor: pointer; }
  .mini-toggle { display: flex; border-radius: 8px; padding: 2px; background: #0A1712; border: 1px solid #234534; }
  .mini-toggle button { border: none; background: transparent; color: #8FAA9B; font-size: 10px; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  .mini-toggle button.active { background: #22C17E; color: #052A1B; }

  .rank-list { display: flex; flex-direction: column; gap: 8px; }
  .rank-item { display: flex; align-items: center; gap: 10px; }
  .rank-name { font-size: 11px; width: 80px; flex-shrink: 0; color: #EAF3EC; white-space: normal; line-height: 1.3; word-break: break-word; }
  .rank-bar-wrap { flex: 1; height: 10px; border-radius: 5px; background: #17301F; overflow: hidden; }
  .rank-bar { height: 100%; background: #22C17E; border-radius: 5px; }
  .rank-bar.amber { background: #FF9645; }
  .rank-count { font-size: 11px; width: 48px; text-align: right; flex-shrink: 0; color: #9FBBAA; font-family: ui-monospace, monospace; }

  .chart-wrap { position: relative; width: 100%; }
  .axis-ticks { position: relative; height: 16px; margin-top: 2px; }
  .axis-ticks span { position: absolute; transform: translateX(-50%); font-size: 9px; color: #6E8779; white-space: nowrap; }

  .chart-legend-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #9FBBAA; }
  .legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .legend-swatch.dash { width: 16px; height: 0; border-top: 2px dashed; border-radius: 0; }

  .recent-title { font-size: 12px; margin-bottom: 8px; color: #6E8779; }
  .recent-list { display: flex; flex-direction: column; gap: 8px; }
  .recent-item { border-radius: 8px; padding: 10px 12px; background: #10201A; border: 1px solid #234534; }
  .recent-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .recent-date { font-size: 12px; font-family: ui-monospace, monospace; color: #9FBBAA; }
  .recent-mode-badge { font-size: 9px; padding: 2px 6px; border-radius: 5px; background: #17301F; border: 1px solid #234534; color: #9FBBAA; }
  .recent-mode-badge.routine { color: #22C17E; border-color: #24603F; }
  .recent-mode-badge.airtime { color: #FF9645; border-color: #5A3A1E; }
  .recent-meta { font-size: 10px; color: #6E8779; margin-top: 3px; }
  .recent-content { font-size: 13px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .recent-tech-chip { font-size: 11px; background: #17301F; border: 1px solid #234534; border-radius: 6px; padding: 3px 7px; }
  .recent-note { font-size: 11px; margin-top: 4px; color: #6E8779; }
  .recent-actions { display: flex; gap: 6px; margin-top: 8px; }
  .recent-actions button { font-size: 10px; padding: 5px 9px; border-radius: 6px; background: #17301F; border: 1px solid #234534; color: #9FBBAA; cursor: pointer; }
  .recent-actions button.danger { color: #FF9645; }

  .favorite-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 8px; background: #17301F; border: 1px solid #234534; }
  .favorite-item + .favorite-item { margin-top: 6px; }
  .favorite-name { font-size: 12px; font-weight: 600; }
  .favorite-meta { font-size: 10px; color: #6E8779; margin-top: 2px; }
  .favorite-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .favorite-actions button { font-size: 10px; padding: 5px 8px; border-radius: 6px; background: #10201A; border: 1px solid #234534; color: #22C17E; cursor: pointer; }
  .favorite-actions button.danger { color: #FF9645; }

  .athlete-add-form { display: flex; gap: 8px; }
  .athlete-add-form input { flex: 1; }
  .athlete-add-form button { flex-shrink: 0; padding: 0 14px; border-radius: 8px; background: #22C17E; color: #052A1B; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }

  .icon { display: inline-block; vertical-align: middle; }
  .routine-total-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: #133220; border: 1px solid #22C17E; margin-bottom: 4px; }
  .routine-total-bar .label { font-size: 11px; color: #9FBBAA; }
  .routine-total-bar .value { font-size: 20px; font-weight: 700; font-family: ui-monospace, monospace; color: #3EDB98; }
</style>
</head>

<div id="root"></div>

var skillIndex = {};
SKILLS.forEach(function (s) { skillIndex[s.id] = s; });
function skillById(id) { return skillIndex[id] || null; }
function firstSkillId(family) {
  var f = SKILLS.filter(function (s) { return s.family === family; });
  if (!f.length) return null;
  f = f.slice().sort(function (a, b) {
    if (a.group !== b.group) return a.group - b.group;
    return (a.dd || 0) - (b.dd || 0);
  });
  return f[0].id;
}
function fmtDD(n) { return (n === null || n === undefined) ? "-" : n.toFixed(1); }
/* group はヌーメリック先頭の数字(4=1回宙、8=2回宙…4刻みで1回転分)。-1=無回転の基礎ジャンプ、0=基本姿勢・バウンス系。 */
function groupLabel(g) {
  if (g === -1) return "基礎ジャンプ(無回転)";
  if (g === 0) return "基本姿勢・バウンス系";
  var saults = g / 4;
  var whole = Math.floor(saults);
  var quarters = Math.round((saults - whole) * 4);
  var fracLabel = quarters === 1 ? "1/4" : quarters === 2 ? "1/2" : quarters === 3 ? "3/4" : "";
  if (whole === 0) return fracLabel + "回宙";
  if (quarters === 0) return whole + "回宙";
  return whole + "+" + fracLabel + "回宙";
}

function buildSkillOptionsHtml(family, selectedId) {
  var list = SKILLS.filter(function (s) { return s.family === family; });
  var groups = {}, order = [];
  list.forEach(function (s) {
    if (!(s.group in groups)) { groups[s.group] = []; order.push(s.group); }
    groups[s.group].push(s);
  });
  order.sort(function (a, b) { return a - b; }); /* 易しい(回転が少ない)技から表示 */
  return order.map(function (g) {
    var items = groups[g].slice().sort(function (a, b) { return (a.dd || 0) - (b.dd || 0); }); /* 各グループ内も難度点が低い順 */
    var opts = items.map(function (s) {
      return '<option value="' + s.id + '"' + (s.id === selectedId ? " selected" : "") + '>' +
        escHtml(s.name) + (s.numeric ? " (" + escHtml(s.numeric) + ")" : "") +
        "</option>";
    }).join("");
    return '<optgroup label="' + escAttr(groupLabel(g)) + '">' + opts + "</optgroup>";
  }).join("");
}

function escHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escAttr(s) { return escHtml(s).replace(/"/g, "&quot;"); }

  return '<svg class="icon" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || "#EAF3EC") + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";
}

function iconMinus(size, color) { return iconSvg('<line x1="5" y1="12" x2="19" y2="12"/>', size, color); }

var API_URL = "https://script.google.com/macros/s/AKfycbwatMAHr8BWhnZqEKjDfQw-w0cCa3EUvqzEt5VH-roKYWjr0IaVarYx1vuidPl2P9Dn/exec";
var BACKEND_READY = false;     // 初回ロード完了フラグ(未完了なら読み込み中画面)
var backendError = null;       // 直近の通信エラーメッセージ(あれば画面上部に表示)

// doGet で全データを取得してローカル配列に反映する
function loadAll() {
  fetch(API_URL, { method: "GET" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.status === "error") throw new Error(data.message || "load error");
      ATHLETES = (data.athletes || []).slice().sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
      FAVORITES = (data.favorites || []).slice().sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
      ENTRIES = (data.entries || []).slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      BACKEND_READY = true;
      backendError = null;
      render();
    })
    .catch(function (err) {
      backendError = "データの読み込みに失敗しました。通信環境を確認して再読み込みしてください。";
      BACKEND_READY = true; // エラー表示付きで画面は出す
      render();
      console.error("loadAll failed", err);
    });
}

// doPost。CORSプリフライトを避けるため Content-Type は text/plain(中身はJSON)。
function postToBackend(payload) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (res && res.status === "error") throw new Error(res.message || "post error");
    return res;
  });
}

// 楽観的更新の背景同期(先にローカルへ反映してから送信。失敗時はメッセージ表示)
function syncToBackend(payload, label) {
  postToBackend(payload).catch(function (err) {
    backendError = (label || "保存") + "の同期に失敗しました。時間をおいて再度お試しください。";
    console.error("sync failed:", label, err);
    render();
  });
}

/* 選手が最近記録した技(単発)を新しい順・重複なしで返す。まだ記録が無ければ空配列。 */
function recentSkillIdsFor(athleteId) {
  if (!athleteId) return [];
  var seen = {}, out = [];
  for (var i = 0; i < ENTRIES.length && out.length < RECENT_SKILL_MAX; i++) {
    var e = ENTRIES[i];
    if (e.mode !== "single" || e.athleteId !== athleteId || !e.skillId) continue;
    if (seen[e.skillId] || !skillById(e.skillId)) continue;
    seen[e.skillId] = true;
    out.push(e.skillId);
  }
  return out;
}

/* ②本数の増減。0本まで下げられる(跳ばなかった日も記録として残せるようにするため)。 */
function stepSingleReps(delta) {
  var next = (Number(S.single.reps) || 0) + delta;
  if (next < 0) next = 0;
  if (next > MAX_SINGLE_REPS) next = MAX_SINGLE_REPS;
  S.single.reps = next;
  if (!S.single.results) S.single.results = [];
  /* 減らしたぶんの成功/失敗は捨て、増やしたぶんは未選択で足す */
  if (S.single.results.length > next) S.single.results = S.single.results.slice(0, next);
  while (S.single.results.length < next) S.single.results.push(null);
  render();
}
/* ②成功/失敗の選択。同じものをもう一度押すと未選択に戻せる(任意入力のため)。 */

function countResults(results, value) {

/* 本数ぶんの成功/失敗を1本＝1文字の文字列にする。○=成功 / ×=失敗 / -=どちらも選ばなかった。
   スプレッドシートを直接開いたときにそのまま読めるようにするため、配列ではなく文字列で保存する。
   (列名を results ではなく repResults にしているのは、ルーティーン用の既存列 result と紛らわしいため) */
function encodeRepResults(results, reps) {
  var out = "";
  for (var i = 0; i < reps; i++) {

    out += v === "success" ? "○" : (v === "fail" ? "×" : "-");
  }
  return out;
}

// ---- Tスコア計算(草加市トランポリン協会「Time/Score Converter」https://1040tramp.com/score/ の計算式を採用) ----
// FIGルール上は時間点(T)の換算式は存在せず滞空時間をそのまま得点とするだけだが(§17.2.1等)、
// このアプリでは草加市トランポリン協会が実際の大会運営(HDTS/VERIFLITE計測不備時の代替)で使っている
// 「Tスコア = ストップウォッチ計測タイム(秒) × 係数」という実務上の計算式をそのまま採用する。
// 係数の決め方は4モードから選択できる(既定は区分表=STEPPED、サイトも「公式運用に最も近い」としている):
//   ・区分表(STEPPED)   … 公式係数表を0.5秒刻みの階段状に適用。区分判定は「前の値 < SW ≦ 区分値」。
//                          9秒以下は0.735固定、20秒超は0.845で頭打ち。
//   ・連続式(LINEAR)    … 係数 = 0.735 + (SW − 9) × 0.01 という連続関数。区分の境界での不公平を避ける。
//   ・実測最適(DATA-FIT) … 係数 = 0.011466 × SW + 0.625531。実測139件からの回帰式(R²=0.70)。
//   ・固定(FIXED)       … 運用者が指定した係数をどのタイムにも一律適用。
// タイム・Tスコアともに小数第3位以降は切り捨て(四捨五入ではない)— サイトの「計算ルール」に明記された仕様。
var STEPPED_COEF_TABLE = [
  { upTo: 9.0, label: "～9秒", coef: 0.735 },
  { upTo: 9.5, label: "～9.5秒", coef: 0.740 },
  { upTo: 10.0, label: "～10秒", coef: 0.745 },
  { upTo: 10.5, label: "～10.5秒", coef: 0.750 },
  { upTo: 11.0, label: "～11秒", coef: 0.755 },
  { upTo: 11.5, label: "～11.5秒", coef: 0.760 },
  { upTo: 12.0, label: "～12秒", coef: 0.765 },
  { upTo: 12.5, label: "～12.5秒", coef: 0.770 },
  { upTo: 13.0, label: "～13秒", coef: 0.775 },
  { upTo: 13.5, label: "～13.5秒", coef: 0.780 },
  { upTo: 14.0, label: "～14秒", coef: 0.785 },
  { upTo: 14.5, label: "～14.5秒", coef: 0.790 },
  { upTo: 15.0, label: "～15秒", coef: 0.795 },
  { upTo: 15.5, label: "～15.5秒", coef: 0.800 },
  { upTo: 16.0, label: "～16秒", coef: 0.805 },
  { upTo: 16.5, label: "～16.5秒", coef: 0.810 },
  { upTo: 17.0, label: "～17秒", coef: 0.815 },
  { upTo: 17.5, label: "～17.5秒", coef: 0.820 },
  { upTo: 18.0, label: "～18秒", coef: 0.825 },
  { upTo: 18.5, label: "～18.5秒", coef: 0.830 },
  { upTo: 19.0, label: "～19秒", coef: 0.835 },
  { upTo: 19.5, label: "～19.5秒", coef: 0.840 },
  { upTo: 20.0, label: "～20秒", coef: 0.845 }
];
// 小数第3位以降を切り捨て(四捨五入ではない)。浮動小数点誤差を避けるため微小値を足してからfloorする。
function truncate2(n) {
  return Math.floor(n * 100 + 1e-9) / 100;
}
function steppedLookup(sw) {
  for (var i = 0; i < STEPPED_COEF_TABLE.length; i++) {
    if (sw <= STEPPED_COEF_TABLE[i].upTo) return { coef: STEPPED_COEF_TABLE[i].coef, category: STEPPED_COEF_TABLE[i].label };
  }
  return { coef: 0.845, category: "上限" }; // 20秒超は頭打ち
}
// タイム・モードからTスコアの内訳({sw, coef, category, score})を計算する。入力が空/無効ならnull。
function computeTScore(v) {
  if (v === "" || v === null || v === undefined) return null;
  var n = Number(v);
  if (isNaN(n) || n < 0) return null;
  var sw = truncate2(n);
  var mode = S.tScoreMode || "stepped";
  var coef, category;
  if (mode === "linear") {
    coef = 0.735 + (sw - 9) * 0.01;
    category = "連続式";
  } else if (mode === "datafit") {
    coef = 0.011466 * sw + 0.625531;
    category = "実測最適";
  } else if (mode === "fixed") {
    var fc = Number(S.tScoreFixedCoef);
    if (S.tScoreFixedCoef === "" || S.tScoreFixedCoef === null || S.tScoreFixedCoef === undefined || isNaN(fc)) return null;
    coef = fc;
    category = "固定係数";
  } else {
    var looked = steppedLookup(sw);
    coef = looked.coef;
    category = looked.category;
  }
  return { sw: sw, coef: coef, category: category, score: truncate2(sw * coef) };
}
function tScoreFor(v) {
  var r = computeTScore(v);
  return r ? r.score : null;
}
function setTScoreMode(mode) { S.tScoreMode = mode; render(); }
function setTScoreFixedCoef(v) { S.tScoreFixedCoef = v; render(); }
function routineTotalDD(skillsArr) {
  return skillsArr.reduce(function (sum, row) {
    var sk = skillById(row.skillId);
    return sum + (sk && sk.dd ? sk.dd : 0);
  }, 0);
}

// 月曜始まりの週の開始日・終了日(YYYY-MM-DD文字列)を返す
function isoWeekRange(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDay(); // 0=日,1=月,...,6=土
  var diffToMonday = (day === 0 ? -6 : 1 - day);
  var monday = new Date(d);
  monday.setDate(d.getDate() + diffToMonday);
  var sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  function fmt(dt) {
    var mm = String(dt.getMonth() + 1).padStart(2, "0");
    var dd = String(dt.getDate()).padStart(2, "0");
    return dt.getFullYear() + "-" + mm + "-" + dd;
  }
  return { start: fmt(monday), end: fmt(sunday) };
}
function periodLabel(period) {
  return period === "day" ? "日" : period === "week" ? "週" : period === "month" ? "月" : "年";
}
// 選択中の粒度(日・週・月・年)で、1件の記録がどの区間に属するかのキーを返す
function routineBinKey(period, dateStr) {
  if (period === "day") return dateStr;
  if (period === "week") return isoWeekRange(dateStr).start; // その週の月曜日をキーにする
  if (period === "month") return dateStr.slice(0, 7);
  return dateStr.slice(0, 4);
}
// バーグラフ・詳細見出しに表示する区間ラベル
function routineBinLabel(period, key) {
  if (period === "day") return key.slice(5);
  if (period === "week") { var r = isoWeekRange(key); return r.start.slice(5) + "〜" + r.end.slice(5); }
  return key;
}
// 実施記録を選択中の粒度で区間ごとに集計し、日付の古い順に並べて返す(グラフの1本1本に対応)
function routineBinsFor(routineEs, period) {
  var map = {};
  routineEs.forEach(function (e) {
    var key = routineBinKey(period, e.date);
    if (!map[key]) map[key] = [];
    map[key].push(e);
  });
  var keys = Object.keys(map).sort();
  return keys.map(function (key) {
    return { key: key, label: routineBinLabel(period, key), count: map[key].length, entries: map[key] };
  });
}
// 単発(技記録)を選択中の粒度で区間ごとに集計: 本数(全技合計の成功+失敗)・成功数・成功率を返す(日付の古い順)
function singleBinsFor(singleEs, period) {
  var map = {};
  singleEs.forEach(function (e) {
    var key = routineBinKey(period, e.date);
    if (!map[key]) map[key] = { entries: [], reps: 0, judged: 0, success: 0 };
    map[key].entries.push(e);
    map[key].reps += entryCount(e);
    map[key].judged += entryJudged(e);
    map[key].success += Number(e.success) || 0;
  });
  var keys = Object.keys(map).sort();
  return keys.map(function (key) {
    var b = map[key];
    var rate = b.judged > 0 ? Math.round((b.success / b.judged) * 100) : null;
    return { key: key, label: routineBinLabel(period, key), reps: b.reps, success: b.success, rate: rate, entries: b.entries };
  });
}

/* ---- 技の難度点カード ---- */
function renderSkillInfoCard(skill) {
  if (!skill) return '<div class="empty-card">技が選択されていません</div>';
  var pieces = [{ label: "基準点", value: skill.base }];
  if (skill.twist !== null && skill.twist !== undefined) pieces.push({ label: "捻り加点", value: skill.twist });
  if (skill.backBonus !== null && skill.backBonus !== undefined) pieces.push({ label: "後方加点", value: skill.backBonus });
  var piecesHtml = pieces.map(function (p) {
    return '<div class="dd-piece"><div class="dd-piece-label">' + escHtml(p.label) + '</div><div class="dd-piece-value">' + fmtDD(p.value) + "</div></div>";
  }).join("");
  piecesHtml += '<div class="dd-piece total"><div class="dd-piece-label">難度点(DD)</div><div class="dd-piece-value">' + fmtDD(skill.dd) + "</div></div>";
  return (
    '<div class="skill-info-card">' +
    '<div class="skill-info-name">' + escHtml(skill.name) + "</div>" +
    (skill.numeric ? '<span class="skill-info-code">' + escHtml(skill.numeric) + "</span>" : "") +
    '<div class="dd-breakdown">' + piecesHtml + "</div>" +
    "</div>"
  );
}

/* ②本数(0本可)と、本数ぶんの成功/失敗。③ヨレは仕様未定のため押せないプレースホルダー。 */
function renderRepsBlock() {
  var reps = Number(S.single.reps) || 0;
  var results = S.single.results || [];
  var stepper =
    '<div class="reps-step">' +
    '<button class="reps-step-btn" onclick="stepSingleReps(-1)"' + (reps <= 0 ? " disabled" : "") + ">−</button>" +
    '<span class="reps-step-num' + (reps === 0 ? " zero" : "") + '">' + reps + "</span>" +
    '<button class="reps-step-btn" onclick="stepSingleReps(1)">＋</button>' +
    '<span class="reps-step-unit">本</span>' +
    "</div>";
  var rows = "";
  if (reps === 0) {
    rows = '<div class="sub-label">0本のままでも保存できます(その技に入ったが跳べなかった日の記録として残せます)。</div>';
  } else {
    for (var i = 0; i < reps; i++) {
      var v = results[i] || null;
      rows +=
        '<div class="rep-item"><span class="rep-idx">' + (i + 1) + "本目</span>" +
        '<span class="rep-picks">' +
        '<button class="rep-pick ok' + (v === "success" ? " on" : "") + '" onclick="setSingleResult(' + i + ", 'success')\">成功</button>" +
        '<button class="rep-pick ng' + (v === "fail" ? " on" : "") + '" onclick="setSingleResult(' + i + ", 'fail')\">失敗</button>" +
        '<button class="rep-pick soon" disabled>ヨレ</button>' +
        "</span></div>";
    }
    rows = '<div class="rep-list">' + rows + "</div>" +
      '<div class="sub-label">成功・失敗は選ばなくても保存できます。選んだものをもう一度押すと取り消せます。</div>';
  }
  return '<div><span class="field-label">本数</span>' + stepper + rows + "</div>";
}

/* ---- 記録一覧 ---- */
function skillLabelForEntry(e) {
  var sk = skillById(e.skillId);
  return sk ? sk.name : "(削除された技)";
}

/* 総本数。reps を持つ記録(本数を選んで保存したもの)はその値、
   持たない過去の記録は従来どおり 成功+失敗 を総本数とみなす。 */
function entryCount(e) {
  if (e && e.reps != null && e.reps !== "") return Number(e.reps) || 0;
  return (Number(e.success) || 0) + (Number(e.fail) || 0);
}
/* 成功/失敗のどちらかを選んだ本数。成功率の分母はこちらを使う
   (成功・失敗を選ばなかった本を分母に入れると成功率が実際より低く出てしまうため)。
   過去の記録では entryCount と同じ値になるので、表示は変わらない。 */
function entryJudged(e) { return (Number(e.success) || 0) + (Number(e.fail) || 0); }
function entryRatePct(e) {
  var judged = entryJudged(e);
  return judged > 0 ? Math.round((Number(e.success) || 0) / judged * 100) : null;
}

function renderEntryCard(e) {
  var confirming = S.confirmDeleteId === e.id;
  var modeLabel = e.mode === "routine" ? "ルーティーン" : (e.mode === "airtime" ? "タイム計測" : "単発");
  var content;
  if (e.mode === "airtime") {
    content =
      '<span class="recent-tech-chip" style="color:' + COLORS.amber + ';">' + (e.airTimeReps ? e.airTimeReps + "本ジャンプ ・" : "") + "タイム" + e.airTime.toFixed(2) + "秒</span>";
  } else if (e.mode === "single") {
    var sk = skillById(e.skillId);
    var targetSk = e.kakariTarget ? skillById(e.kakariTarget) : null;
    var total = entryCount(e);
    var rate = entryRatePct(e);
    content =
      '<span class="recent-tech-chip" style="color:' + COLORS.accent + ';">' + (sk ? escHtml(sk.name) : "(削除された技)") + (sk && sk.numeric ? " (" + escHtml(sk.numeric) + ")" : "") + " ・DD" + fmtDD(e.totalDD) + "</span>" +
      '<span class="recent-tech-chip" style="color:' + COLORS.accent + ';">' + total + "本" +
        (entryJudged(e) > 0 ? "(成功" + (Number(e.success) || 0) + "・失敗" + (Number(e.fail) || 0) + ")" : "") +
        (rate !== null ? " ・" + rate + "%" : "") + "</span>" +
      (e.kakari ? '<span class="recent-tech-chip" style="color:' + COLORS.accent + ';border-color:#24603F;">かかり練習' + (targetSk ? " → " + escHtml(targetSk.name) : "") + "</span>" : "");
  } else {
    var names = e.skills.map(function (sid, i) {
      var s = skillById(sid);
      return (i + 1) + ". " + (s ? s.name : "(削除された技)");
    });
    content =
      '<div style="width:100%;font-size:11px;line-height:1.7;color:#9FBBAA;">' + names.map(escHtml).join(" / ") + "</div>" +
      '<span class="recent-tech-chip" style="color:' + COLORS.accent + ';">技' + e.skills.length + "本 ・合計DD " + fmtDD(e.totalDD) + "</span>" +
      (e.runCount ? '<span class="recent-tech-chip">実施' + e.runCount + "本</span>" : "") +
      (e.airTime ? '<span class="recent-tech-chip">タイム' + e.airTime.toFixed(2) + "秒</span>" : "") +
      (e.tScore ? '<span class="recent-tech-chip" style="color:' + COLORS.accent + ';">目安Tスコア ' + e.tScore.toFixed(2) + "点</span>" : "") +
      (e.result === "success" ? '<span class="recent-tech-chip" style="color:' + COLORS.accent + ';border-color:#24603F;">成功</span>' : "") +
      (e.result === "fail" ? '<span class="recent-tech-chip" style="color:' + COLORS.amber + ';border-color:#5A3B1E;">失敗</span>' : "");
  }
  var caption = e.mode === "routine" ? (e.routineName || "ルーティーン") : (e.mode === "airtime" ? "タイム計測" : skillLabelForEntry(e));
  var videoBtns = "";
  if (e.videoSuccessUrl) videoBtns += '<button class="recent-video-btn" onclick="openVideoModal(\'' + e.videoSuccessUrl + "','" + escAttr(caption + "(成功)") + "')\">" + iconPlay(9, COLORS.accent) + "成功</button>";
  if (e.videoFailUrl) videoBtns += '<button class="recent-video-btn fail-tone" onclick="openVideoModal(\'' + e.videoFailUrl + "','" + escAttr(caption + "(失敗)") + "')\">" + iconPlay(9, COLORS.amber) + "失敗</button>";

  return (
    '<div class="recent-item">' +
    '<div class="recent-top-row"><span class="recent-date">' + escHtml(e.date) + "</span>" +
    '<span class="recent-mode-badge' + (e.mode === "routine" ? " routine" : (e.mode === "airtime" ? " airtime" : "")) + '">' + modeLabel + "</span></div>" +
    '<div class="recent-meta">' + escHtml(athleteName(e.athleteId)) + " ・台:" + escHtml(e.platform) + (e.mode === "routine" && e.routineName ? " ・「" + escHtml(e.routineName) + "」" : "") + "</div>" +
    '<div class="recent-content">' + content + "</div>" +
    (e.note ? '<div class="recent-note">' + escHtml(e.note) + "</div>" : "") +
    (videoBtns ? '<div class="recent-content" style="margin-top:6px;">' + videoBtns + "</div>" : "") +
    '<div class="recent-actions">' +
    (confirming
      ? ('<button class="danger" onclick="confirmDeleteEntry(\'' + e.id + "')\">削除確定</button><button onclick=\"cancelDeleteEntry()\">戻る</button>")
      : ('<button class="danger" onclick="askDeleteEntry(\'' + e.id + "')\">削除</button>")) +
    "</div></div>"
  );
}

function statCard(label, value, sub) {

function renderRankList(items) {
  if (!items.length) return '<div class="empty-card">データがありません</div>';

  return (
    '<div class="rank-list">' +
    items.map(function (it) {
      var pct = maxV > 0 ? (it.value / maxV * 100) : 0;
      return '<div class="rank-item"><span class="rank-name">' + escHtml(it.name) + '</span><div class="rank-bar-wrap"><div class="rank-bar' + (it.amber ? " amber" : "") + '" style="width:' + pct.toFixed(1) + '%;"></div></div><span class="rank-count">' + escHtml(it.display) + "</span></div>";
    }).join("") +
    "</div>"
  );

function renderDDTrendChart(entries) {
  var values = entries.map(function (e) { return e.totalDD || 0; });
  var maxV = Math.max.apply(null, values.concat([1])) * 1.15;
  var w = 400, h = 120, padX = 10, padTop = 10, padBottom = 10;
  var innerH = h - padTop - padBottom;
  var n = entries.length;
  var stepX = n > 1 ? (w - padX * 2) / (n - 1) : 0;
  var points = entries.map(function (e, i) {
    var x = padX + stepX * i;
    var y = padTop + innerH - ((e.totalDD || 0) / maxV) * innerH;
    return { x: x, y: y };
  });
  var polyPoints = points.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
  var circles = points.map(function (p) {
    return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3" fill="' + COLORS.accent + '" stroke="#0A1712" stroke-width="1" />';
  }).join("");
  var gridLines = [0.25, 0.5, 0.75].map(function (f) {
    var y = padTop + innerH * (1 - f);
    return '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + w + '" y2="' + y.toFixed(1) + '" stroke="#234534" stroke-width="1" stroke-dasharray="3,3" />';
  }).join("");
  var svg =
    '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" height="120" preserveAspectRatio="none">' +
    gridLines +
    '<polyline points="' + polyPoints + '" fill="none" stroke="' + COLORS.accent + '" stroke-width="2" />' +
    circles +
    "</svg>";
  var tickIdxs = n <= 1 ? [0] : (n === 2 ? [0, 1] : [0, Math.floor((n - 1) / 2), n - 1]);
  var uniqueIdxs = tickIdxs.filter(function (v, i, arr) { return arr.indexOf(v) === i; });
  var ticksHtml = uniqueIdxs.map(function (i) {
    var pct = n > 1 ? (i / (n - 1)) * 100 : 50;
    return '<span style="left:' + pct.toFixed(1) + '%;">' + escHtml(entries[i].date.slice(5)) + "</span>";
  }).join("");
  return '<div class="chart-wrap">' + svg + '</div><div class="axis-ticks">' + ticksHtml + "</div><div class=\"stat-sub\" style=\"margin-top:2px;\">最大DD目盛り: " + fmtDD(maxV) + "</div>";
}

function renderJumpTimeTrendChart(entries) {
  var values = entries.map(function (e) { return e.airTime || 0; });
  var minV = Math.min.apply(null, values);
  var maxV = Math.max.apply(null, values);
  var range = maxV - minV;
  if (range < 0.4) range = 0.4; // ensure the trend is visibly readable even when times are close together
  var pad = range * 0.25;
  var chartMin = Math.max(0, minV - pad);
  var chartMax = maxV + pad;
  var span = (chartMax - chartMin) || 1;
  var w = 400, h = 150, padX = 16, padTop = 22, padBottom = 26;
  var innerH = h - padTop - padBottom;
  var n = entries.length;
  var stepX = n > 1 ? (w - padX * 2) / (n - 1) : 0;
  var bestIdx = 0;
  values.forEach(function (v, i) { if (v > values[bestIdx]) bestIdx = i; });
  var points = entries.map(function (e, i) {
    var v = e.airTime || 0;
    var x = padX + stepX * i;
    var y = padTop + innerH - ((v - chartMin) / span) * innerH;
    return { x: x, y: y, v: v };
  });
  var polyPoints = points.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
  var areaPoints = polyPoints + " " + points[n - 1].x.toFixed(1) + "," + (padTop + innerH).toFixed(1) + " " + points[0].x.toFixed(1) + "," + (padTop + innerH).toFixed(1);
  var circles = points.map(function (p, i) {
    var isBest = i === bestIdx;
    return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (isBest ? 5 : 3) + '" fill="' + (isBest ? COLORS.accent : COLORS.amber) + '" stroke="#0A1712" stroke-width="1.5" />';
  }).join("");
  var valueLabels = points.map(function (p, i) {
    var isBest = i === bestIdx;
    var labelY = (p.y - 9 < padTop) ? p.y + 15 : p.y - 9;
    return '<text x="' + p.x.toFixed(1) + '" y="' + labelY.toFixed(1) + '" font-size="11" text-anchor="middle" fill="' + (isBest ? COLORS.accent : "#B7C9BC") + '" font-weight="' + (isBest ? "700" : "400") + '">' + p.v.toFixed(2) + "</text>";
  }).join("");
  var gridLines = [0.25, 0.5, 0.75].map(function (f) {
    var y = padTop + innerH * (1 - f);
    return '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + w + '" y2="' + y.toFixed(1) + '" stroke="#234534" stroke-width="1" stroke-dasharray="3,3" />';
  }).join("");
  var axisLabels =
    '<text x="2" y="' + (padTop + 3).toFixed(1) + '" font-size="10" fill="' + COLORS.textFaint + '">' + chartMax.toFixed(2) + "秒</text>" +
    '<text x="2" y="' + (padTop + innerH + 3).toFixed(1) + '" font-size="10" fill="' + COLORS.textFaint + '">' + chartMin.toFixed(2) + "秒</text>";
  var svg =
    '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" height="150" preserveAspectRatio="none">' +
    gridLines +
    '<polygon points="' + areaPoints + '" fill="' + COLORS.amber + '" opacity="0.14" />' +
    '<polyline points="' + polyPoints + '" fill="none" stroke="' + COLORS.amber + '" stroke-width="2" />' +
    circles +
    valueLabels +
    axisLabels +
    "</svg>";
  var tickIdxs = n <= 1 ? [0] : (n === 2 ? [0, 1] : [0, Math.floor((n - 1) / 2), n - 1]);
  var uniqueIdxs = tickIdxs.filter(function (v, i, arr) { return arr.indexOf(v) === i; });
  var ticksHtml = uniqueIdxs.map(function (i) {
    var pct = n > 1 ? (i / (n - 1)) * 100 : 50;
    return '<span style="left:' + pct.toFixed(1) + '%;">' + escHtml(entries[i].date.slice(5)) + "</span>";
  }).join("");
  var first = values[0], last = values[values.length - 1];
  var delta = last - first;
  var deltaTxt = (delta >= 0 ? "+" : "") + delta.toFixed(2) + "秒";
  var trendHtml = n > 1
    ? ('<div class="stat-sub" style="margin-top:4px; color:' + (delta >= 0 ? COLORS.accent : COLORS.textFaint) + ';">初回 ' + first.toFixed(2) + "秒 → 最新 " + last.toFixed(2) + "秒(" + deltaTxt + (delta >= 0 ? " ・伸びています" : "") + ")</div>")
    : "";
  return (
    '<div class="chart-wrap">' + svg + '</div><div class="axis-ticks">' + ticksHtml + "</div>" +
    trendHtml +
    '<div class="stat-sub" style="margin-top:2px;">緑の点=ベスト記録 ・タイムが長いほど高くジャンプできています</div>'
  );
}

function renderJumpHistoryModal() {

  var athleteId = S.jumpHistoryModal.athleteId;

  var athlete = ATHLETES.filter(function (a) { return a.id === athleteId; })[0];

/* ---- ダッシュボードの「ルーティーン」カード:日・週・月・年ごとの実施本数バーグラフ(タップで詳細) ---- */
function renderRoutineCountBarChart(bins, period) {
  var maxV = Math.max.apply(null, bins.map(function (b) { return b.count; }).concat([1]));
  var w = 400, h = 150, padX = 12, padTop = 22, padBottom = 26;
  var innerH = h - padTop - padBottom;
  var n = bins.length;
  var slot = (w - padX * 2) / n;
  var barW = Math.max(10, Math.min(34, slot * 0.55));
  var bars = bins.map(function (b, i) {
    var cx = padX + slot * (i + 0.5);
    var barH = Math.max((b.count / maxV) * innerH, 3);
    var y = padTop + innerH - barH;
    return (
      '<g style="cursor:pointer;" onclick="selectRoutineDetailBin(\'' + b.key + '\')">' +
      '<rect x="' + (cx - barW / 2).toFixed(1) + '" y="' + (padTop).toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + innerH.toFixed(1) + '" fill="transparent" />' +
      '<rect x="' + (cx - barW / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + barH.toFixed(1) + '" rx="4" fill="' + COLORS.accent + '" />' +
      '<text x="' + cx.toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" font-size="11" text-anchor="middle" fill="' + COLORS.textFaint + '" font-weight="600">' + b.count + "</text>" +
      "</g>"
    );
  }).join("");

/* ---- ダッシュボードの「1日の総本数(単発)」カード:日・週・月・年ごとの本数・成功率バーグラフ(タップで詳細) ---- */
function renderSingleCountBarChart(bins, period) {
  var maxV = Math.max.apply(null, bins.map(function (b) { return b.reps; }).concat([1]));
  var w = 400, h = 160, padX = 12, padTop = 30, padBottom = 26;
  var innerH = h - padTop - padBottom;
  var n = bins.length;
  var slot = (w - padX * 2) / n;
  var barW = Math.max(10, Math.min(34, slot * 0.55));
  var bars = bins.map(function (b, i) {
    var cx = padX + slot * (i + 0.5);
    var barH = Math.max((b.reps / maxV) * innerH, 3);
    var y = padTop + innerH - barH;
    return (
      '<g style="cursor:pointer;" onclick="selectSingleDetailBin(\'' + b.key + '\')">' +
      '<rect x="' + (cx - barW / 2).toFixed(1) + '" y="' + (padTop).toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + innerH.toFixed(1) + '" fill="transparent" />' +
      '<rect x="' + (cx - barW / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + barH.toFixed(1) + '" rx="4" fill="' + COLORS.accent + '" />' +
      '<text x="' + cx.toFixed(1) + '" y="' + (y - 15).toFixed(1) + '" font-size="11" text-anchor="middle" fill="' + COLORS.textFaint + '" font-weight="600">' + b.reps + "本</text>" +
      '<text x="' + cx.toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" font-size="9" text-anchor="middle" fill="' + (b.rate !== null ? COLORS.accent : COLORS.textFaint) + '">' + (b.rate !== null ? b.rate + "%" : "-") + "</text>" +
      "</g>"
    );
  }).join("");
  var gridLines = [0.25, 0.5, 0.75].map(function (f) {
    var y = padTop + innerH * (1 - f);
    return '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + w + '" y2="' + y.toFixed(1) + '" stroke="#234534" stroke-width="1" stroke-dasharray="3,3" />';
  }).join("");
  var svg =
    '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" height="160" preserveAspectRatio="none">' +
    gridLines +
    bars +
    "</svg>";
  var ticksHtml = bins.map(function (b, i) {
    var pct = n > 0 ? ((i + 0.5) / n) * 100 : 50;
    return '<span style="left:' + pct.toFixed(1) + '%;">' + escHtml(b.label) + "</span>";
  }).join("");
  return '<div class="chart-wrap">' + svg + '</div><div class="axis-ticks">' + ticksHtml + "</div>";
}

/* ---- ダッシュボードの「よく使う台」カード:台ごとの総本数・成功率(単発の技記録が基準) ---- */
// 棒(総本数・左軸)+点線(成功率・右軸0-100%固定)の複合グラフ。台ごとに「どれだけ飛んでいて」「どれだけ成功しているか」を一目で比較できるようにする。
function renderPlatformComboChart(items) {
  var maxReps = Math.max.apply(null, items.map(function (it) { return it.reps; }).concat([1]));
  var w = 400, h = 210, padX = 14, padTop = 30, padBottom = 30;
  var innerH = h - padTop - padBottom;
  var n = items.length;
  var slot = (w - padX * 2) / n;
  var barW = Math.max(28, Math.min(52, slot * 0.45));
  var points = items.map(function (it, i) {
    var cx = padX + slot * (i + 0.5);
    var barH = maxReps > 0 ? Math.max((it.reps / maxReps) * innerH, it.reps > 0 ? 3 : 0) : 0;
    var barY = padTop + innerH - barH;
    var rateForY = it.rate === null ? 0 : it.rate;
    var circleY = padTop + innerH - (rateForY / 100) * innerH;
    return { cx: cx, barY: barY, barH: barH, circleY: circleY, it: it };
  });
  var baseline = padTop + innerH;
  var barsHtml = points.map(function (p) {
    var numY = p.barH > 24 ? baseline - 10 : p.barY - 8;
    var numColor = p.barH > 24 ? "#052A1B" : COLORS.textFaint;
    return (
      '<rect x="' + (p.cx - barW / 2).toFixed(1) + '" y="' + p.barY.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + p.barH.toFixed(1) + '" rx="5" fill="' + COLORS.accent + '" />' +
      '<text x="' + p.cx.toFixed(1) + '" y="' + numY.toFixed(1) + '" font-size="13" text-anchor="middle" fill="' + numColor + '" font-weight="700">' + p.it.reps + "</text>"
    );
  }).join("");
  var linePoints = points.map(function (p) { return p.cx.toFixed(1) + "," + p.circleY.toFixed(1); }).join(" ");
  var lineHtml = points.length > 1 ? '<polyline points="' + linePoints + '" fill="none" stroke="' + COLORS.amber + '" stroke-width="2" stroke-dasharray="6,4" />' : "";
  var circlesHtml = points.map(function (p) {
    var label = p.it.rate === null ? "-" : p.it.rate + "%";
    return (
      '<circle cx="' + p.cx.toFixed(1) + '" cy="' + p.circleY.toFixed(1) + '" r="17" fill="' + COLORS.amber + '" stroke="#0A1712" stroke-width="2" />' +
      '<text x="' + p.cx.toFixed(1) + '" y="' + (p.circleY + 4).toFixed(1) + '" font-size="11" text-anchor="middle" fill="#2A1707" font-weight="700">' + label + "</text>"
    );
  }).join("");
  var axisLabels =
    '<text x="2" y="' + (padTop + innerH + 12).toFixed(1) + '" font-size="9" fill="' + COLORS.textFaint + '">0</text>' +
    '<text x="' + (w - 2) + '" y="' + (padTop + innerH + 12).toFixed(1) + '" font-size="9" text-anchor="end" fill="' + COLORS.textFaint + '">0%</text>' +
    '<text x="' + (w - 2) + '" y="' + (padTop - 8).toFixed(1) + '" font-size="9" text-anchor="end" fill="' + COLORS.textFaint + '">100%</text>';
  var svg =
    '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" height="210" preserveAspectRatio="none">' +
    axisLabels + barsHtml + lineHtml + circlesHtml +
    "</svg>";
  var ticksHtml = items.map(function (it, i) {
    var pct = n > 0 ? ((i + 0.5) / n) * 100 : 50;
    return '<span style="left:' + pct.toFixed(1) + '%;">' + escHtml(it.name) + "</span>";
  }).join("");
  var legend =
    '<div class="chart-legend-row">' +
    '<span class="legend-item"><span class="legend-swatch" style="background:' + COLORS.accent + ';"></span>総本数(左軸・バー内が本数)</span>' +
    '<span class="legend-item"><span class="legend-swatch dash" style="border-color:' + COLORS.amber + ';"></span>成功率(右軸・○内が%)</span>' +
    "</div>";
  return '<div class="chart-wrap">' + svg + '</div><div class="axis-ticks">' + ticksHtml + "</div>" + legend;
}

function renderTeamDashboard() {
  var totalEntries = ENTRIES.length;
  var singleEntries = ENTRIES.filter(function (e) { return e.mode === "single"; });
  var singleCount = singleEntries.length;
  var routineCount = ENTRIES.filter(function (e) { return e.mode === "routine"; }).length;
  var totalDDSum = ENTRIES.reduce(function (s, e) { return s + (e.totalDD || 0); }, 0);
  var totalReps = singleEntries.reduce(function (s, e) { return s + entryCount(e); }, 0);
  var totalJudged = singleEntries.reduce(function (s, e) { return s + entryJudged(e); }, 0);
  var totalSuccess = singleEntries.reduce(function (s, e) { return s + (Number(e.success) || 0); }, 0);
  var teamRate = totalJudged > 0 ? Math.round(totalSuccess / totalJudged * 100) : null;
  var statsHtml =
    '<div class="stat-grid">' +
    statCard("登録選手数", ATHLETES.length + "名") +
    statCard("総記録数", totalEntries + "件") +
    statCard("単発記録", singleCount + "件") +
    statCard("ルーティーン記録", routineCount + "件") +
    statCard("総本数(単発)", totalReps + "本", teamRate !== null ? "成功率 " + teamRate + "%" : "記録なし") +
    statCard("合計難度点", fmtDD(totalDDSum)) +
    "</div>";

  var platformCounts = PLATFORMS.map(function (p) {
    var c = ENTRIES.filter(function (e) { return e.platform === p; }).length;

  });

  var famCount = { forward: 0, backward: 0 };
  ENTRIES.forEach(function (e) {
    if (e.mode === "single") { var sk = skillById(e.skillId); if (sk) famCount[sk.family]++; }
    else if (e.mode === "routine") { e.skills.forEach(function (sid) { var sk = skillById(sid); if (sk) famCount[sk.family]++; }); }
  });
  var famChart =
    '<div class="chart-card"><div class="chart-title">技の系統内訳(のべ本数)</div>' +
    renderRankList([
      { name: "前系", value: famCount.forward, display: famCount.forward + "本" },
      { name: "後系", value: famCount.backward, display: famCount.backward + "本", amber: true },
    ]) +
    "</div>";

  var rankMode = S.dashRankMode;
  var athleteStats = ATHLETES.map(function (a) {
    var es = ENTRIES.filter(function (e) { return e.athleteId === a.id; });
    var total = es.reduce(function (s, e) { return s + (e.totalDD || 0); }, 0);
    return { name: a.name, count: es.length, total: total };
  });
  athleteStats.sort(function (a, b) { return rankMode === "total" ? b.total - a.total : b.count - a.count; });
  var rankItems = athleteStats.map(function (a) {
    return rankMode === "total" ? { name: a.name, value: a.total, display: fmtDD(a.total) } : { name: a.name, value: a.count, display: a.count + "件" };
  });
  var athleteRankChart =
    '<div class="chart-card"><div class="chart-title-row"><span>選手ランキング</span><div class="mini-toggle">' +
    '<button class="' + (rankMode === "total" ? "active" : "") + '" onclick="setDashRankMode(\'total\')">合計DD</button>' +
    '<button class="' + (rankMode === "count" ? "active" : "") + '" onclick="setDashRankMode(\'count\')">記録数</button>' +
    "</div></div>" +
    renderRankList(rankItems) +
    "</div>";

  return statsHtml + platformChart + famChart + athleteRankChart + renderRecentSection(null);

function renderAthleteDashboard(athleteId) {
  var athlete = ATHLETES.filter(function (a) { return a.id === athleteId; })[0];
  if (!athlete) return '<div class="empty-card">選手が見つかりません</div>';
  var es = ENTRIES.filter(function (e) { return e.athleteId === athleteId; });
  var singleEs = es.filter(function (e) { return e.mode === "single"; });
  var routineEs = es.filter(function (e) { return e.mode === "routine"; });
  var avgSingleDD = singleEs.length ? (singleEs.reduce(function (s, e) { return s + e.totalDD; }, 0) / singleEs.length) : 0;
  var bestSingleDD = singleEs.length ? Math.max.apply(null, singleEs.map(function (e) { return e.totalDD; })) : 0;
  var platformTop = "-";
  if (es.length) {
    var pc = {};
    es.forEach(function (e) { pc[e.platform] = (pc[e.platform] || 0) + 1; });
    platformTop = Object.keys(pc).sort(function (a, b) { return pc[b] - pc[a]; })[0];
  }
  var airtimeEs = es.filter(function (e) { return e.mode === "airtime"; });
  var jump10Es = airtimeEs.filter(function (e) { return e.airTimeReps === 10; });
  var jump20Es = airtimeEs.filter(function (e) { return e.airTimeReps === 20; });
  var best10 = jump10Es.length ? Math.max.apply(null, jump10Es.map(function (e) { return e.airTime; })) : null;
  var best20 = jump20Es.length ? Math.max.apply(null, jump20Es.map(function (e) { return e.airTime; })) : null;

  // 「1日の総本数」= 直近に単発記録がある日(実際の今日の日付ではない)を基準に、その日だけの本数・成功率を集計
  var latestSingleDate = singleEs.length
    ? singleEs.reduce(function (max, e) { return e.date > max ? e.date : max; }, singleEs[0].date)
    : null;
  var dayEs = latestSingleDate ? singleEs.filter(function (e) { return e.date === latestSingleDate; }) : [];
  var dayTotalReps = dayEs.reduce(function (s, e) { return s + entryCount(e); }, 0);
  var dayTotalJudged = dayEs.reduce(function (s, e) { return s + entryJudged(e); }, 0);
  var dayTotalSuccess = dayEs.reduce(function (s, e) { return s + (Number(e.success) || 0); }, 0);
  var dayRate = dayTotalJudged > 0 ? Math.round(dayTotalSuccess / dayTotalJudged * 100) : null;

  var statsHtml =
    '<div class="stat-grid">' +
    clickableStatCard("10本ジャンプ ベストタイム", best10 !== null ? best10.toFixed(2) + "秒" : "記録なし", jump10Es.length ? "タップで推移を見る" : "", "openJumpHistoryModal('" + athleteId + "',10)") +
    clickableStatCard("20本ジャンプ ベストタイム", best20 !== null ? best20.toFixed(2) + "秒" : "記録なし", jump20Es.length ? "タップで推移を見る" : "", "openJumpHistoryModal('" + athleteId + "',20)") +
    clickableStatCard("ルーティーン", routineEs.length + "本", routineEs.length ? "タップで日・週・月・年の実施ペースを見る" : "", "openRoutineDetailModal('" + athleteId + "')") +
    statCard("試技", "準備中", "近日公開予定") +
    clickableStatCard("1日の総本数(単発)", latestSingleDate ? (dayTotalReps + "本") : "記録なし", singleEs.length ? ("成功率" + (dayRate !== null ? dayRate + "%" : "-") + " ・" + latestSingleDate.slice(5) + " ・タップで日・週・月・年の推移を見る") : "", "openSingleDetailModal('" + athleteId + "')") +
    statCard("単発最高DD・平均DD", fmtDD(bestSingleDD), "平均" + fmtDD(avgSingleDD)) +
    clickableStatCard("よく使う台", platformTop, es.length ? "タップで台ごとの総本数・成功率を見る" : "", "openPlatformDetailModal('" + athleteId + "')") +
    "</div>";

  var chronological = es.filter(function (e) { return e.mode !== "airtime"; }).sort(function (a, b) { return a.createdAt - b.createdAt; });
  var trendChart =
    '<div class="chart-card"><div class="chart-title">難度点(DD)の推移(記録ごと)</div>' +
    (chronological.length ? renderDDTrendChart(chronological) : '<div class="empty-card">まだ記録がありません</div>') +
    "</div>";

  var famCount = { forward: 0, backward: 0 };
  var platCount = {};
  PLATFORMS.forEach(function (p) { platCount[p] = 0; });
  es.forEach(function (e) {
    platCount[e.platform] = (platCount[e.platform] || 0) + 1;
    if (e.mode === "single") { var sk = skillById(e.skillId); if (sk) famCount[sk.family]++; }
    else if (e.mode === "routine") { e.skills.forEach(function (sid) { var sk = skillById(sid); if (sk) famCount[sk.family]++; }); }
  });
  var famChart =
    '<div class="chart-card"><div class="chart-title">系統内訳(のべ本数)</div>' +
    renderRankList([
      { name: "前系", value: famCount.forward, display: famCount.forward + "本" },
      { name: "後系", value: famCount.backward, display: famCount.backward + "本", amber: true },
    ]) +
    "</div>";
  var platItems = PLATFORMS.map(function (p) { return { name: p, value: platCount[p], display: platCount[p] + "件" }; });
  var platChart = '<div class="chart-card"><div class="chart-title">台別使用件数</div>' + renderRankList(platItems) + "</div>";

  var techMode = S.dashTechMode;
  var usage = {};
  es.forEach(function (e) {
    if (e.mode === "single") {
      var sk = skillById(e.skillId);
      if (sk) {
        if (!usage[sk.name]) usage[sk.name] = { count: 0, dd: sk.dd, singleReps: 0, singleJudged: 0, singleSuccess: 0 };
        var reps = entryCount(e);
        usage[sk.name].count += reps > 0 ? reps : 1;
        usage[sk.name].singleReps += reps;
        usage[sk.name].singleJudged += entryJudged(e);
        usage[sk.name].singleSuccess += Number(e.success) || 0;
      }
    } else if (e.mode === "routine") {
      e.skills.forEach(function (sid) {
        var s2 = skillById(sid);
        if (s2) { if (!usage[s2.name]) usage[s2.name] = { count: 0, dd: s2.dd, singleReps: 0, singleJudged: 0, singleSuccess: 0 }; usage[s2.name].count += 1; }
      });
    }
  });
  var usageArr = Object.keys(usage).map(function (name) {
    var u = usage[name];
    var rate = u.singleJudged > 0 ? Math.round(u.singleSuccess / u.singleJudged * 100) : null;
    return { name: name, count: u.count, dd: u.dd, rate: rate };
  });
  if (techMode === "count") usageArr.sort(function (a, b) { return b.count - a.count; });
  else usageArr.sort(function (a, b) { return b.dd - a.dd; });
  usageArr = usageArr.slice(0, 8);
  var usageItems = usageArr.map(function (u) {
    return techMode === "count"
      ? { name: u.name, value: u.count, display: u.count + "本" + (u.rate !== null ? " ・" + u.rate + "%" : "") }
      : { name: u.name, value: u.dd, display: "DD" + fmtDD(u.dd) };
  });
  var usageChart =
    '<div class="chart-card"><div class="chart-title-row"><span>技別ランキング</span><div class="mini-toggle">' +
    '<button class="' + (techMode === "count" ? "active" : "") + '" onclick="setDashTechMode(\'count\')">本数・成功率</button>' +
    '<button class="' + (techMode === "dd" ? "active" : "") + '" onclick="setDashTechMode(\'dd\')">難度点</button>' +
    "</div></div>" +
    renderRankList(usageItems) +
    "</div>";

  return (
    '<div class="card raised" style="text-align:center;"><div style="font-size:15px;font-weight:700;">' + escHtml(athlete.name) + "</div></div>" +
    statsHtml + trendChart + famChart + platChart + usageChart + renderRecentSection(athleteId)
  );
}

function renderDashboardPage() {
  return '<div class="section">' + renderDashScopeSelect() + (S.dashScope === "team" ? renderTeamDashboard() : renderAthleteDashboard(S.dashScope)) + "</div>";
}

/* ---- 全体シェル ---- */
function renderHeader() {
  return (
    '<div class="header-row"><div class="header-left">' +
    (LOGO_DATA_URI ? '<img class="app-logo" src="' + LOGO_DATA_URI + '" alt="logo" />' : "") +
    '<div class="app-title-wrap"><div class="app-title">' + escHtml(TEAM_NAME) + '</div><div class="app-tag">トランポリン競技 練習・大会記録</div></div>' +
    "</div></div>"
  );
}

function renderTabs() {
  return (
    '<div class="tabs">' +
    '<button class="tab-btn' + (S.tab === "record" ? " active" : "") + '" onclick="selectTab(\'record\')">記録</button>' +
    '<button class="tab-btn' + (S.tab === "dashboard" ? " active" : "") + '" onclick="selectTab(\'dashboard\')">ダッシュボード</button>' +
    "</div>"
  );
}

function renderApp() {
  // 初回ロード中(スプレッドシートからの読み込み待ち)
  if (!BACKEND_READY) {
    return (
      '<div class="app-shell"><div class="container">' +
      renderHeader() +
      '<div class="empty-card" style="margin-top:24px;padding:40px 24px;">データを読み込んでいます…</div>' +
      "</div></div>"
    );
  }
  var errBanner = backendError
    ? '<div class="date-warning" style="margin-bottom:16px;">⚠️ ' + escHtml(backendError) + "</div>"
    : "";
  return (
    '<div class="app-shell"><div class="container">' +
    errBanner +
    renderHeader() +
    renderTabs() +
    (S.tab === "record" ? renderRecordPage() : renderDashboardPage()) +
    "</div></div>" +
    renderVideoModal() +
    renderJumpHistoryModal() +
    renderRoutineDetailModal() +
    renderSingleDetailModal() +
    renderPlatformDetailModal()
  );
}


/* 日本語入力(IME)の変換中は再描画しない。
   render() は #root を丸ごと作り直すため、変換の途中で走ると入力欄が別の要素に差し替わり、
   未確定の文字(変換中のひらがな)が消えてしまう。iPhoneでは特に顕著。
   変換中に来た描画要求は覚えておき、変換が確定した直後に1回だけまとめて描き直す。 */
var isComposing = false;
var renderQueuedWhileComposing = false;
document.addEventListener("compositionstart", function () { isComposing = true; }, true);
document.addEventListener("compositionend", function () {
  isComposing = false;
  if (renderQueuedWhileComposing) {
    renderQueuedWhileComposing = false;
    /* このイベントの処理が終わってから描き直す(処理中に要素を差し替えないため) */
    setTimeout(render, 0);
  }
}, true);
/* 変換中に入力欄からフォーカスが外れると compositionend が来ないことがあるので、その保険 */
document.addEventListener("blur", function () {
  if (isComposing) { isComposing = false; renderQueuedWhileComposing = false; }
}, true);

function render() {
  if (isComposing) { renderQueuedWhileComposing = true; return; }
  var root = document.getElementById("root");
  var active = document.activeElement;
  var focusId = null, selStart = null, selEnd = null;
  if (active && active.id && root.contains(active)) {
    focusId = active.id;
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) {}
  }
  root.innerHTML = renderApp();
  if (focusId) {
    var el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (selStart !== null && selStart !== undefined && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

/* ---- 起動:まずスプレッドシートから全データを読み込む ---- */
render();      // 読み込み中画面を即表示
loadAll();     // doGet完了後にデータ入りで再描画
</script>
